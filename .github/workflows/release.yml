name: release

# A tag like v0.8.1 publishes that version: the package to PyPI, then its
# entry to the MCP Registry, which checks that the version is on PyPI.
# Clones keep updating from main as before; only PyPI installs follow tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag, the package and server.json name one version
        run: |
          python - <<'EOF'
          import json, os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          server = json.load(open("server.json"))
          found = {project, server["version"], server["packages"][0]["version"]}
          if found != {tag}:
              raise SystemExit(f"tag {tag} but pyproject/server.json say {sorted(found)}")
          EOF

      - name: Build the wheel and the source archive
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eda-agent/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.3

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for PyPI to serve the new version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            curl --fail --silent "https://pypi.org/pypi/eda-agent/$version/json" >/dev/null && exit 0
            sleep 10
          done
          echo "eda-agent $version is not on PyPI after 5 minutes"; exit 1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Publish the entry to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
